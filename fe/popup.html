<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReviewAnaler</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" type="module"></script>
</head>
<body>
    <main>
        <h1>쿠팡 리뷰 분석</h1>
        <p class="hint">쿠팡 리뷰를 조회한 뒤 분석할 리뷰를 선택하세요. 직접 입력도 가능합니다.</p>

        <form id="analysis">
            <label class="field">
                <span>상품 ID</span>
                <input id="product-id" inputmode="numeric" pattern="[0-9]+" maxlength="50"
                       placeholder="예 7330106093" required>
            </label>

            <fieldset class="collector">
                <legend>쿠팡 리뷰 조회</legend>
                <label class="field"><span>요청 위치</span>
                    <select id="request-mode">
                        <option value="tab">열린 쿠팡 상품 탭</option>
                        <option value="worker">확장프로그램 서비스 워커</option>
                    </select>
                </label>
                <label class="field"><span>정렬</span>
                    <select id="review-sort">
                        <option value="ORDER_SCORE_ASC">쿠팡 기본순</option>
                        <option value="DATE_DESC">최신순</option>
                    </select>
                </label>
                <label class="field"><span>별점 필터</span>
                    <select id="review-rating-filter">
                        <option value="">전체 별점</option>
                        <option value="1">1점</option>
                        <option value="2">2점</option>
                    </select>
                </label>
                <label class="field"><span>조회 페이지 · 10건씩</span>
                    <input id="review-page" type="number" min="1" max="10000" step="1" value="1">
                </label>
                <button type="button" id="collect">리뷰 조회</button>
                <p id="collection-status" class="status" role="status" aria-live="polite"></p>
                <details id="response-diagnostic" hidden>
                    <summary>응답 구조 진단</summary>
                    <p class="hint">필드 이름과 자료형을 표시합니다. 아래 내용을 복사해 전달하면 리뷰 표시 오류를 확인할 수 있습니다.</p>
                    <textarea id="response-shape" aria-label="응답 구조 진단 내용" rows="9" readonly></textarea>
                </details>
                <div id="collected"></div>
                <section id="reviewer-history" class="reviewer-history" hidden>
                    <h2>작성자의 다른 상품평</h2>
                    <p id="reviewer-history-status" class="status" role="status" aria-live="polite"></p>
                    <div id="reviewer-history-list"></div>
                    <div class="review-actions">
                        <button type="button" id="reviewer-history-prev" class="secondary">이전</button>
                        <button type="button" id="reviewer-history-next" class="secondary">다음</button>
                    </div>
                </section>
                <button type="button" id="use-reviews" class="secondary" hidden>선택한 리뷰를 분석 목록에 추가</button>
            </fieldset>

            <div id="reviews"></div>
            <div class="actions">
                <button type="button" id="add-review" class="secondary">리뷰 추가</button>
                <button type="submit" id="submit">분석하기</button>
            </div>

            <details>
                <summary>로컬 WAS 설정</summary>
                <label class="field">
                    <span>127.0.0.1 포트</span>
                    <input id="port" type="number" inputmode="numeric" min="1" max="65535" step="1"
                           value="8765" required>
                </label>
            </details>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <ul id="results" class="results" hidden></ul>
    </main>

    <template id="review-template">
        <fieldset class="review">
            <legend>리뷰</legend>
            <label class="field">
                <span>별점</span>
                <select data-rating required>
                    <option value="">선택</option>
                    <option value="1">1점</option>
                    <option value="2">2점</option>
                    <option value="3">3점</option>
                    <option value="4">4점</option>
                    <option value="5">5점</option>
                </select>
            </label>
            <label class="field">
                <span>본문</span>
                <textarea data-text rows="3" maxlength="3000" required></textarea>
            </label>
            <div class="review-actions">
                <button type="button" data-selection class="secondary">선택한 본문 가져오기</button>
                <button type="button" data-remove class="quiet">삭제</button>
            </div>
        </fieldset>
    </template>
</body>
</html>
