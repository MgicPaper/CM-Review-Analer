[project]
name = "was"
version = "0.1.0"
description = "ReviewAnaler API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5,<1",
    "pydantic-settings>=2.10,<3",
    "typesafe-sdk>=0.7.5,<0.8",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
was = "was:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
